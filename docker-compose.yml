services:
  postgres:
    image: postgres:17-alpine
    container_name: codex-zero-hero-postgres
    environment:
      POSTGRES_DB: personal_finance
      POSTGRES_USER: finance_app
      POSTGRES_PASSWORD: finance_app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
